name: Main

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t simple-flask-app .

      - name: Start container
        run: docker run -d --name app -p 5000:5000 simple-flask-app

      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Remove container
        if: always()
        run: docker rm -f app
