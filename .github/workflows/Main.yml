name: Main

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build image
        run: docker build -t simple-flask-app .

      - name: Start container
        run: docker run -d --name app -p 5000:5000 simple-flask-app

      - name: Check /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Remove container
        if: always()
        run: docker rm -f app

  auto-merge:
    needs: build-and-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  docs:
    needs: build-and-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Generate docs
        run: pdoc ./app.py -o site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    needs: docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
